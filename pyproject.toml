[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "burns"
version = "0.0.22"
description = "Ken Burns pan/zoom video effects: turn a still image (or a sequence of stills) into a cinematic pan/zoom film."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "ken-burns",
    "video",
    "pan-zoom",
    "moviepy",
    "animation",
    "slideshow",
]
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    "numpy",
    "moviepy",
    "pillow",
    "looks>=0.0.7",
]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/burns"
Repository = "https://github.com/thorwhalen/burns"
Documentation = "https://thorwhalen.github.io/burns"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
# CI runs `pytest --doctest-modules` with NO path argument, so pytest falls back
# to `testpaths`. With "tests" alone, every `>>>` under burns/ was collected by
# nothing and the green tick covered none of them. Listing the package here is
# what makes the module doctests run — both locally and in CI.
testpaths = [
    "tests",
    "burns",
]
# Must match exactly what CI passes with `-o`, or a doctest relying on a flag
# CI does not set passes locally and fails there. CI passes:
#   -o doctest_optionflags='ELLIPSIS IGNORE_EXCEPTION_DETAIL'
# In particular: no NORMALIZE_WHITESPACE.
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.install]
extras = "dev"

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
